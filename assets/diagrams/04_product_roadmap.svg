<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820">
  <defs><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity=".12"/></filter><style>text{font-family:"Microsoft YaHei",Arial;fill:#182720}.t{font-size:38px;font-weight:700}.st{font-size:19px;fill:#65736d}.h{font-size:23px;font-weight:700}.b{font-size:18px}.box{stroke:#2f493e;stroke-width:2;rx:14;filter:url(#s)}</style></defs>
  <rect width="1600" height="820" fill="#f4f6f3"/>
  <text x="70" y="72" class="t">产品路线图：先建立可信诊断，再强化AI交互与用户验证</text>
  <text x="70" y="110" class="st">每一阶段解决一个关键风险，避免在基础事实不可靠时扩大Agent自主性</text>
  <line x1="160" y1="220" x2="1450" y2="220" stroke="#38564b" stroke-width="5"/>
  <circle cx="220" cy="220" r="18" fill="#2f8a69"/><circle cx="590" cy="220" r="18" fill="#2f8a69"/><circle cx="960" cy="220" r="18" fill="#e8a12e"/><circle cx="1330" cy="220" r="18" fill="#bbc5c0"/>
  <rect class="box" x="80" y="270" width="300" height="330" fill="#e9f6f0"/>
  <text x="110" y="315" class="h">V0 数据与诊断底座</text><text x="110" y="352" class="st">已完成</text><text x="110" y="400" class="b">· 空间数据治理</text><text x="110" y="434" class="b">· 居民活动与路径模拟</text><text x="110" y="468" class="b">· 活动失效诊断</text><text x="110" y="502" class="b">· 设施反事实评估</text><text x="110" y="555" class="st">验证：事实可追溯、路径可执行</text>
  <rect class="box" x="450" y="270" width="300" height="330" fill="#e9f6f0"/>
  <text x="480" y="315" class="h">V1 受约束AI原型</text><text x="480" y="352" class="st">已完成</text><text x="480" y="400" class="b">· DeepSeek受约束决策</text><text x="480" y="434" class="b">· 情境化行为解释</text><text x="480" y="468" class="b">· 决策日志与异常回退</text><text x="480" y="502" class="b">· LLM消融实验</text><text x="480" y="555" class="st">验证：识别结构化先验贡献</text>
  <rect class="box" x="820" y="270" width="300" height="330" fill="#fff5dc"/>
  <text x="850" y="315" class="h">V2 规划Copilot</text><text x="850" y="352" class="st">下一优先级</text><text x="850" y="400" class="b">· 居民诉求自然语言转译</text><text x="850" y="434" class="b">· GIS工具调用与事实核验</text><text x="850" y="468" class="b">· 多主体方案审议</text><text x="850" y="502" class="b">· 规划行动卡生成</text><text x="850" y="555" class="st">验证：完整率、事实一致、采纳率</text>
  <rect class="box" x="1190" y="270" width="300" height="330" fill="#fff"/>
  <text x="1220" y="315" class="h">V3 真实业务试点</text><text x="1220" y="352" class="st">数据到位后</text><text x="1220" y="400" class="b">· 规划师真实任务测试</text><text x="1220" y="434" class="b">· 居民反馈与问卷校准</text><text x="1220" y="468" class="b">· 设施运营数据接入</text><text x="1220" y="502" class="b">· 多区域复制与治理</text><text x="1220" y="555" class="st">验证：任务耗时、采纳与实施效果</text>
  <rect x="80" y="665" width="1410" height="78" rx="12" fill="#17251f"/><text x="115" y="714" font-family="Microsoft YaHei,Arial" font-size="22" font-weight="700" style="fill:#fff">当前产品策略：优先证明AI能够连接居民问题、空间证据与规划审议，暂缓复杂选址优化与实时运营</text>
</svg>
