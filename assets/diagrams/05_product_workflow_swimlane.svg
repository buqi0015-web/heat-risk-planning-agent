<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#426057"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#e06c3c"/>
    </marker>
    <filter id="shadow">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity=".10"/>
    </filter>
    <style>
      text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#17251f}
      .title{font-size:38px;font-weight:700}
      .sub{font-size:18px;fill:#66756f}
      .phase{font-size:15px;font-weight:700;fill:#52625c}
      .lane-title{font-size:20px;font-weight:700}
      .lane-sub{font-size:13px;fill:#74817c}
      .box-title{font-size:18px;font-weight:700}
      .box-text{font-size:14px;fill:#53625c}
      .tag{font-size:12px;font-weight:700}
      .lane{stroke:#dbe3df;stroke-width:1}
      .box{stroke:#cad6d1;stroke-width:1.5;rx:8;filter:url(#shadow)}
      .flow{stroke:#426057;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .handoff{stroke:#e06c3c;stroke-width:3;fill:none;stroke-dasharray:8 6;marker-end:url(#arrowOrange)}
    </style>
  </defs>

  <rect width="1800" height="1120" fill="#f5f7f6"/>
  <text x="58" y="62" class="title">端到端产品工作流：从高温情景到可审议的规划行动</text>
  <text x="58" y="98" class="sub">泳道展示当前MVP中规划师、LLM Agent、确定性专业模型与验证机制的职责分工及交接关系</text>

  <g>
    <rect x="260" y="130" width="285" height="48" fill="#edf2f0"/>
    <rect x="545" y="130" width="285" height="48" fill="#edf2f0"/>
    <rect x="830" y="130" width="285" height="48" fill="#edf2f0"/>
    <rect x="1115" y="130" width="285" height="48" fill="#edf2f0"/>
    <rect x="1400" y="130" width="340" height="48" fill="#edf2f0"/>
    <text x="365" y="160" class="phase">01 情景与任务</text>
    <text x="653" y="160" class="phase">02 活动与路径</text>
    <text x="942" y="160" class="phase">03 失效诊断</text>
    <text x="1210" y="160" class="phase">04 干预推演</text>
    <text x="1512" y="160" class="phase">05 审议与行动</text>
  </g>

  <g>
    <rect class="lane" x="58" y="190" width="1682" height="180" fill="#fff"/>
    <rect x="58" y="190" width="202" height="180" fill="#fff5e9"/>
    <text x="82" y="235" class="lane-title">责任规划师</text>
    <text x="82" y="260" class="lane-sub">提出任务、审议结果</text>

    <rect class="lane" x="58" y="370" width="1682" height="210" fill="#f7fbff"/>
    <rect x="58" y="370" width="202" height="210" fill="#eaf4ff"/>
    <text x="82" y="415" class="lane-title">LLM Agent</text>
    <text x="82" y="440" class="lane-sub">推理、解释、转译</text>

    <rect class="lane" x="58" y="580" width="1682" height="260" fill="#f8fcfa"/>
    <rect x="58" y="580" width="202" height="260" fill="#e9f6ef"/>
    <text x="82" y="625" class="lane-title">专业模型与工具</text>
    <text x="82" y="650" class="lane-sub">GIS、行为、规则系统</text>

    <rect class="lane" x="58" y="840" width="1682" height="190" fill="#fbf9fd"/>
    <rect x="58" y="840" width="202" height="190" fill="#f2ecf8"/>
    <text x="82" y="885" class="lane-title">验证与治理</text>
    <text x="82" y="910" class="lane-sub">审查、日志、边界</text>
  </g>

  <g>
    <rect class="box" x="290" y="225" width="220" height="105" fill="#fff"/>
    <text x="310" y="258" class="box-title">选择分析任务</text>
    <text x="310" y="284" class="box-text">区域、高温情景</text>
    <text x="310" y="307" class="box-text">关注人群与活动</text>

    <rect class="box" x="860" y="225" width="225" height="105" fill="#fff"/>
    <text x="880" y="258" class="box-title">查看问题诊断</text>
    <text x="880" y="284" class="box-text">谁受影响、何处失效</text>
    <text x="880" y="307" class="box-text">哪些内容仍待核验</text>

    <rect class="box" x="1435" y="225" width="255" height="105" fill="#fff"/>
    <text x="1455" y="258" class="box-title">审议并形成行动</text>
    <text x="1455" y="284" class="box-text">比较方案、补充现场信息</text>
    <text x="1455" y="307" class="box-text">确定优先级与实施条件</text>
  </g>

  <g>
    <rect class="box" x="290" y="415" width="220" height="120" fill="#fff"/>
    <text x="310" y="448" class="box-title">理解任务上下文</text>
    <text x="310" y="474" class="box-text">读取人群、活动与情景</text>
    <text x="310" y="497" class="box-text">组织后续工具调用目标</text>
    <text x="310" y="520" class="tag" fill="#3779b6">LLM：任务理解</text>

    <rect class="box" x="860" y="415" width="225" height="120" fill="#fff"/>
    <text x="880" y="448" class="box-title">解释活动失效</text>
    <text x="880" y="474" class="box-text">在允许动作集合中推演</text>
    <text x="880" y="497" class="box-text">转译原因与设施需求</text>
    <text x="880" y="520" class="tag" fill="#3779b6">LLM：受约束推理</text>

    <rect class="box" x="1435" y="415" width="255" height="120" fill="#fff"/>
    <text x="1455" y="448" class="box-title">组织规划行动卡</text>
    <text x="1455" y="474" class="box-text">汇总事实、推断与限制</text>
    <text x="1455" y="497" class="box-text">生成可审议的方案解释</text>
    <text x="1455" y="520" class="tag" fill="#3779b6">LLM：证据组织与表达</text>
  </g>

  <g>
    <rect class="box" x="290" y="625" width="220" height="160" fill="#fff"/>
    <text x="310" y="658" class="box-title">构建空间事实底座</text>
    <text x="310" y="686" class="box-text">人口、POI、用地与路网</text>
    <text x="310" y="710" class="box-text">LST、树冠、水体与气象</text>
    <text x="310" y="734" class="box-text">核验真实地点与可达性</text>
    <text x="310" y="765" class="tag" fill="#27816c">确定性事实</text>

    <rect class="box" x="575" y="625" width="220" height="160" fill="#fff"/>
    <text x="595" y="658" class="box-title">模拟活动与路径</text>
    <text x="595" y="686" class="box-text">生成人群与日常活动链</text>
    <text x="595" y="710" class="box-text">匹配真实OD与步行路径</text>
    <text x="595" y="734" class="box-text">逐道路边累计热暴露</text>
    <text x="595" y="765" class="tag" fill="#27816c">GIS + 行为模型</text>

    <rect class="box" x="860" y="625" width="225" height="160" fill="#fff"/>
    <text x="880" y="658" class="box-title">识别活动失效</text>
    <text x="880" y="686" class="box-text">定位路径与目的地问题</text>
    <text x="880" y="710" class="box-text">生成允许行为动作集合</text>
    <text x="880" y="734" class="box-text">形成结构化诊断事实</text>
    <text x="880" y="765" class="tag" fill="#27816c">规则 + 诊断模型</text>

    <rect class="box" x="1145" y="625" width="220" height="160" fill="#fff"/>
    <text x="1165" y="658" class="box-title">生成干预情景</text>
    <text x="1165" y="686" class="box-text">匹配存量与候选设施</text>
    <text x="1165" y="710" class="box-text">考虑功能、时间与容量</text>
    <text x="1165" y="734" class="box-text">计算干预前后变化</text>
    <text x="1165" y="765" class="tag" fill="#27816c">设施与反事实模型</text>
  </g>

  <g>
    <rect class="box" x="290" y="885" width="220" height="105" fill="#fff"/>
    <text x="310" y="918" class="box-title">数据来源审查</text>
    <text x="310" y="944" class="box-text">坐标、语义、覆盖率</text>
    <text x="310" y="967" class="box-text">人口权重与版本记录</text>

    <rect class="box" x="575" y="885" width="220" height="105" fill="#fff"/>
    <text x="595" y="918" class="box-title">路径与计算审查</text>
    <text x="595" y="944" class="box-text">可达性、连续性、守恒</text>
    <text x="595" y="967" class="box-text">缺测与异常处理</text>

    <rect class="box" x="860" y="885" width="225" height="105" fill="#fff"/>
    <text x="880" y="918" class="box-title">LLM输出治理</text>
    <text x="880" y="944" class="box-text">Schema、白名单、复核</text>
    <text x="880" y="967" class="box-text">异常回退与决策日志</text>

    <rect class="box" x="1145" y="885" width="220" height="105" fill="#fff"/>
    <text x="1165" y="918" class="box-title">效果与稳定性评估</text>
    <text x="1165" y="944" class="box-text">反事实、消融、敏感性</text>
    <text x="1165" y="967" class="box-text">不确定性与外部校准边界</text>

    <rect class="box" x="1435" y="885" width="255" height="105" fill="#fff"/>
    <text x="1455" y="918" class="box-title">标记人工核验事项</text>
    <text x="1455" y="944" class="box-text">现场条件、管理权限</text>
    <text x="1455" y="967" class="box-text">真实行为与设施使用率</text>
  </g>

  <path class="flow" d="M510 705H575"/>
  <path class="flow" d="M795 705H860"/>
  <path class="flow" d="M1085 705H1145"/>
  <path class="handoff" d="M400 330V415"/>
  <path class="handoff" d="M400 535V625"/>
  <path class="handoff" d="M972 625V535"/>
  <path class="handoff" d="M972 415V330"/>
  <path class="handoff" d="M1255 785V885"/>
  <path class="handoff" d="M1365 705H1560V535"/>
  <path class="handoff" d="M1560 415V330"/>

  <rect x="58" y="1052" width="1682" height="42" rx="6" fill="#17251f"/>
  <text x="82" y="1079" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="700" style="fill:#fff">关键原则：专业模型生成事实与数值，LLM负责受约束推理与表达，验证机制贯穿全流程，规划师保留最终决策权。</text>
</svg>
