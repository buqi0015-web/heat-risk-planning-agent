<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-opacity=".12"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2f5145"/></marker>
    <style>
      text{font-family:"Microsoft YaHei",Arial,sans-serif;fill:#17251f}.title{font-size:38px;font-weight:700}.sub{font-size:20px;fill:#65736d}.head{font-size:25px;font-weight:700}.body{font-size:19px}.small{font-size:17px;fill:#65736d}.box{stroke:#243a31;stroke-width:2.5;rx:12;filter:url(#shadow)}.line{stroke:#2f5145;stroke-width:4;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#f4f6f3"/>
  <text x="70" y="75" class="title">AI 如何改变责任规划师的高温设施规划工作</text>
  <text x="70" y="112" class="sub">从经验驱动的碎片化判断，推进为有证据、可追溯、可复核的规划诊断</text>
  <text x="110" y="190" class="head" fill="#bd4f3b">AI 介入前：四个工作卡点</text>
  <rect class="box" x="80" y="230" width="300" height="170" fill="#fff5f2"/>
  <text x="110" y="275" class="head">诉求难转译</text><text x="110" y="315" class="body">居民说“太晒、走不动”</text><text x="110" y="348" class="body">规划师需人工判断问题</text><text x="110" y="378" class="small">缺少统一需求结构</text>
  <rect class="box" x="420" y="230" width="300" height="170" fill="#fff5f2"/>
  <text x="450" y="275" class="head">证据难串联</text><text x="450" y="315" class="body">热环境、人口、POI、路网</text><text x="450" y="348" class="body">分散在不同工具与文件</text><text x="450" y="378" class="small">核验耗时且依赖经验</text>
  <rect class="box" x="80" y="440" width="300" height="170" fill="#fff5f2"/>
  <text x="110" y="485" class="head">需求难规模化</text><text x="110" y="525" class="body">少量走访无法覆盖不同</text><text x="110" y="558" class="body">人群、活动和高温情景</text><text x="110" y="588" class="small">容易遗漏弱势群体</text>
  <rect class="box" x="420" y="440" width="300" height="170" fill="#fff5f2"/>
  <text x="450" y="485" class="head">方案难解释</text><text x="450" y="525" class="body">点位推荐缺少服务对象</text><text x="450" y="558" class="body">和实施效果的证据</text><text x="450" y="588" class="small">难以支持多方审议</text>
  <path class="line" d="M755 420 C820 420 820 420 885 420"/>
  <rect class="box" x="735" y="335" width="170" height="170" fill="#fff1cf"/>
  <text x="775" y="395" class="head">AI Agent</text><text x="765" y="432" class="body">组织任务</text><text x="755" y="464" class="body">调用专业工具</text>
  <text x="1000" y="190" class="head" fill="#23755d">AI 介入后：形成规划闭环</text>
  <rect class="box" x="950" y="230" width="560" height="95" fill="#e9f6f0"/>
  <text x="980" y="270" class="head">1. 结构化理解居民问题</text><text x="980" y="302" class="small">提取人群、活动、时间限制、空间痛点和待核验条件</text>
  <rect class="box" x="950" y="350" width="560" height="95" fill="#e9f6f0"/>
  <text x="980" y="390" class="head">2. 自动组织空间证据</text><text x="980" y="422" class="small">调用GIS、路网与热风险工具，核验位置、路径和设施</text>
  <rect class="box" x="950" y="470" width="560" height="95" fill="#e9f6f0"/>
  <text x="980" y="510" class="head">3. 批量推演典型活动</text><text x="980" y="542" class="small">覆盖不同居民与出行约束，发现高温活动失效场景</text>
  <rect class="box" x="950" y="590" width="560" height="95" fill="#e9f6f0"/>
  <text x="980" y="630" class="head">4. 生成可审议行动卡</text><text x="980" y="662" class="small">说明服务谁、解决什么问题、证据是什么、仍需核验什么</text>
  <rect x="80" y="750" width="1430" height="80" rx="12" fill="#17251f"/>
  <text x="115" y="800" font-family="Microsoft YaHei,Arial" font-size="24" font-weight="700" style="fill:#fff">产品价值：减少重复核验与材料整理，让规划师将时间投入现场判断、方案取舍和跨部门协商</text>
</svg>
